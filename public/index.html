
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ᴋᴀʏsᴇᴜʀ_ᴍᴅx - Pairing Server</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="leaves-container" id="leaves"></div>

    <div class="container">
        <div class="card">
            <h1>ᴋᴀʏsᴇᴜʀ_ᴍᴅx</h1>
            <p class="subtitle">« ʟᴇ ɢʟɪᴛᴄʜ ᴇsᴛ ᴍᴀ ᴘᴜɪssᴀɴᴄᴇ »</p>

            <div class="tab-selector">
                <button class="tab-btn active" onclick="switchTab('pairing')">ᴘᴀɪʀɪɴɢ ᴄᴏᴅᴇ</button>
                <button class="tab-btn" onclick="switchTab('qr')">ᴄᴏᴅᴇ ǫʀ</button>
            </div>

            <div id="pairing-section" class="tab-content active">
                <input
                    type="tel"
                    id="phone-number"
                    placeholder="ɴᴜᴍᴇʀᴏ (ᴇx: 24206...)"
                    autocomplete="tel"
                >

                <button
                    class="action-btn"
                    id="pairing-button"
                    onclick="getPairingCode()"
                >
                    ᴏʙᴛᴇɴɪʀ ʟᴇ ᴄᴏᴅᴇ
                </button>

                <div id="code-display" class="display-box">
                    ᴇɴ ᴀᴛᴛᴇɴᴛᴇ...
                </div>
            </div>

            <div id="qr-section" class="tab-content">
                <div id="qrcode-box" class="display-box">
                    <img
                        id="qr-img"
                        src=""
                        alt="QR Code"
                        style="display:none; width:180px; margin:auto;"
                    />
                    <span id="qr-status">ᴄʜᴀʀɢᴇᴍᴇɴᴛ ᴅᴜ ǫʀ...</span>
                </div>
            </div>

            <div class="servers-info">
                <div>⚡ sᴇʀᴠᴇᴜʀ 1 : ᴀᴄᴛɪғ • ⚡ sᴇʀᴠᴇᴜʀ 2 : ᴀᴄᴛɪғ</div>
                <div>⚡ sᴇʀᴠᴇᴜʀ 3 : ᴀᴄᴛɪғ • ⚡ sᴇʀᴠᴇᴜʀ 4 : ᴀᴄᴛɪғ</div>
                <div>⚡ sᴇʀᴠᴇᴜʀ 5 : ᴜʟᴛʀᴀ-ᴘᴜɪssᴀɴᴛ</div>
            </div>

            <a
                href="https://whatsapp.com/channel/0029Vb8cfQn8V0te5K0atc1s"
                target="_blank"
                rel="noopener noreferrer"
                class="channel-btn"
            >
                📢 ᴠᴏɪʀ ʟᴀ ᴄʜᴀɪɴᴇ
            </a>
        </div>
    </div>

    <script>
        let pairingRequestActive = false;
        let qrInterval = null;

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b =>
                b.classList.remove('active')
            );

            document.querySelectorAll('.tab-content').forEach(c =>
                c.classList.remove('active')
            );

            if (tab === 'pairing') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('pairing-section').classList.add('active');

                if (qrInterval) {
                    clearInterval(qrInterval);
                    qrInterval = null;
                }
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('qr-section').classList.add('active');

                loadQR();

                if (!qrInterval) {
                    qrInterval = setInterval(loadQR, 3000);
                }
            }
        }

        function createLeaves() {
            const container = document.getElementById('leaves');

            for (let i = 0; i < 35; i++) {
                const leaf = document.createElement('div');

                leaf.className = 'leaf';
                leaf.style.left = Math.random() * 100 + 'vw';
                leaf.style.animationDuration = (Math.random() * 5 + 4) + 's';
                leaf.style.animationDelay = (Math.random() * 5) + 's';

                container.appendChild(leaf);
            }
        }

        createLeaves();

        async function getPairingCode() {
            if (pairingRequestActive) return;

            const phoneInput = document.getElementById('phone-number');
            const display = document.getElementById('code-display');
            const button = document.getElementById('pairing-button');

            const phone = phoneInput.value.replace(/\D/g, '');

            if (phone.length < 8 || phone.length > 15) {
                alert("ᴇɴᴛʀᴇᴢ ᴜɴ ɴᴜᴍᴇʀᴏ ᴠᴀʟɪᴅᴇ !");
                return;
            }

            pairingRequestActive = true;
            button.disabled = true;
            button.innerText = 'ɢᴇɴᴇʀᴀᴛɪᴏɴ...';
            display.innerText = 'ᴄᴏɴɴᴇxɪᴏɴ ᴀᴜ sᴇʀᴠᴇᴜʀ...';

            try {
                const response = await fetch(
                    '/api/pairing?phone=' + encodeURIComponent(phone),
                    {
                        method: 'GET',
                        cache: 'no-store'
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.code) {
                    display.innerText =
                        data.error || data.details || 'ᴇʀʀᴇᴜʀ ᴅᴇ ᴘᴀɪʀɪɴɢ';

                    return;
                }

                display.innerText = data.code;

            } catch (error) {
                console.error('Pairing error:', error);
                display.innerText = 'ᴇʀʀᴇᴜʀ ᴅᴇ ᴄᴏɴɴᴇxɪᴏɴ';
            } finally {
                pairingRequestActive = false;
                button.disabled = false;
                button.innerText = 'ᴏʙᴛᴇɴɪʀ ʟᴇ ᴄᴏᴅᴇ';
            }
        }

        async function loadQR() {
            const qrImage = document.getElementById('qr-img');
            const qrStatus = document.getElementById('qr-status');

            try {
                const response = await fetch('/api/qr', {
                    cache: 'no-store'
                });

                const data = await response.json();

                if (data.qr) {
                    qrImage.src = data.qr;
                    qrImage.style.display = 'block';
                    qrStatus.style.display = 'none';
                } else {
                    qrImage.style.display = 'none';
                    qrStatus.style.display = 'block';
                    qrStatus.innerText =
                        data.status || 'ǫʀ ɴᴏɴ ᴅɪsᴘᴏɴɪʙʟᴇ';
                }

            } catch (error) {
                qrStatus.style.display = 'block';
                qrStatus.innerText = 'ᴇʀʀᴇᴜʀ ᴅᴜ sᴇʀᴠᴇᴜʀ';
            }
        }
    </script>
</body>
</html>
