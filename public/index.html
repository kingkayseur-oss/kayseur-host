<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ᴋᴀʏsᴇᴜʀ_ᴍᴅx - Pairing Server</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="leaves-container" id="leaves"></div>

    <div class="container">
        <div class="card">
            <h1>ᴋᴀʏsᴇᴜʀ_ᴍᴅx</h1>
            <p class="subtitle">« ʟᴇ ɢʟɪᴛᴄʜ ᴇsᴛ ᴍᴀ ᴘᴜɪssᴀɴᴄᴇ »</p>

            <div class="tab-selector">
                <button class="tab-btn active" onclick="switchTab('pairing')">
                    ᴘᴀɪʀɪɴɢ ᴄᴏᴅᴇ
                </button>
                <button class="tab-btn" onclick="switchTab('qr')">
                    ᴄᴏᴅᴇ ǫʀ
                </button>
            </div>

            <div id="pairing-section" class="tab-content active">
                <input
                    type="tel"
                    id="phone-number"
                    placeholder="ɴᴜᴍᴇʀᴏ (ᴇx: 24206...)"
                    autocomplete="tel"
                >

                <button
                    class="action-btn"
                    id="pairing-button"
                    onclick="getPairingCode()"
                >
                    ᴏʙᴛᴇɴɪʀ ʟᴇ ᴄᴏᴅᴇ
                </button>

                <div id="code-display" class="display-box">
                    ᴇɴ ᴀᴛᴛᴇɴᴛᴇ...
                </div>
            </div>

            <div id="qr-section" class="tab-content">
                <div id="qrcode-box" class="display-box">
                    <img
                        id="qr-img"
                        src=""
                        alt="QR Code"
                        style="display:none; width:180px; margin:auto;"
                    />
                    <span id="qr-status">ᴄʜᴀʀɢᴇᴍᴇɴᴛ ᴅᴜ ǫʀ...</span>
                </div>
            </div>

            <div class="servers-info">
                <div>⚡ sᴇʀᴠᴇᴜʀ 1 : ᴀᴄᴛɪғ • ⚡ sᴇʀᴠᴇᴜʀ 2 : ᴀᴄᴛɪғ</div>
                <div>⚡ sᴇʀᴠᴇᴜʀ 3 : ᴀᴄᴛɪғ • ⚡ sᴇʀᴠᴇᴜʀ 4 : ᴀᴄᴛɪғ</div>
                <div>⚡ sᴇʀᴠᴇᴜʀ 5 : ᴜʟᴛʀᴀ-ᴘᴜɪssᴀɴᴛ</div>
            </div>

            <a
                href="https://whatsapp.com/channel/0029Vb8cfQn8V0te5K0atc1s"
                target="_blank"
                rel="noopener noreferrer"
                class="channel-btn"
            >
                📢 ᴠᴏɪʀ ʟᴀ ᴄʜᴀɪɴᴇ
            </a>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'kayseur_mdx_private_session';

        let pairingRequestActive = false;
        let sessionCreationActive = false;
        let qrInterval = null;
        let statusInterval = null;

        let privateSession = null;

        // Récupération de la session privée enregistrée
        function loadSavedSession() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);

                if (saved) {
                    privateSession = JSON.parse(saved);

                    if (
                        !privateSession.sessionId ||
                        !privateSession.token
                    ) {
                        privateSession = null;
                        localStorage.removeItem(STORAGE_KEY);
                    }
                }
            } catch (error) {
                privateSession = null;
                localStorage.removeItem(STORAGE_KEY);
            }
        }

        loadSavedSession();

        // Création d'une session individuelle
        async function ensureSession() {
            if (privateSession) {
                return privateSession;
            }

            if (sessionCreationActive) {
                throw new Error('Création de session déjà en cours');
            }

            sessionCreationActive = true;

            try {
                const response = await fetch('/api/sessions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    cache: 'no-store'
                });

                const data = await response.json();

                if (!response.ok || !data.sessionId || !data.token) {
                    throw new Error(
                        data.error || data.message || 'Impossible de créer la session'
                    );
                }

                privateSession = {
                    sessionId: data.sessionId,
                    token: data.token
                };

                // Conservation privée sur cet appareil et ce navigateur
                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(privateSession)
                );

                return privateSession;

            } finally {
                sessionCreationActive = false;
            }
        }

        // En-têtes d'authentification de la session
        function sessionHeaders() {
            if (!privateSession) {
                throw new Error('Aucune session disponible');
            }

            return {
                'Authorization': 'Bearer ' + privateSession.token,
                'Content-Type': 'application/json'
            };
        }

        // Vérification de la session
        async function checkSessionStatus() {
            if (!privateSession) return null;

            const response = await fetch(
                '/api/sessions/' + encodeURIComponent(privateSession.sessionId) + '/status',
                {
                    method: 'GET',
                    headers: sessionHeaders(),
                    cache: 'no-store'
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Session inaccessible');
            }

            return data;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(button =>
                button.classList.remove('active')
            );

            document.querySelectorAll('.tab-content').forEach(content =>
                content.classList.remove('active')
            );

            if (tab === 'pairing') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('pairing-section').classList.add('active');

                stopQRPolling();

            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('qr-section').classList.add('active');

                loadQR();
                startQRPolling();
            }
        }

        function startQRPolling() {
            if (qrInterval) return;

            qrInterval = setInterval(loadQR, 3000);
        }

        function stopQRPolling() {
            if (qrInterval) {
                clearInterval(qrInterval);
                qrInterval = null;
            }
        }

        function createLeaves() {
            const container = document.getElementById('leaves');

            for (let i = 0; i < 35; i++) {
                const leaf = document.createElement('div');

                leaf.className = 'leaf';
                leaf.style.left = Math.random() * 100 + 'vw';
                leaf.style.animationDuration = (Math.random() * 5 + 4) + 's';
                leaf.style.animationDelay = (Math.random() * 5) + 's';

                container.appendChild(leaf);
            }
        }

        createLeaves();

        // Génération du code de connexion
        async function getPairingCode() {
            if (pairingRequestActive) return;

            const phoneInput = document.getElementById('phone-number');
            const display = document.getElementById('code-display');
            const button = document.getElementById('pairing-button');

            const phone = phoneInput.value.replace(/\D/g, '');

            if (phone.length < 8 || phone.length > 15) {
                alert("ᴇɴᴛʀᴇᴢ ᴜɴ ɴᴜᴍᴇʀᴏ ᴠᴀʟɪᴅᴇ !");
                return;
            }

            pairingRequestActive = true;
            button.disabled = true;
            button.innerText = 'ɢᴇɴᴇʀᴀᴛɪᴏɴ...';
            display.innerText = 'ᴄʀᴇᴀᴛɪᴏɴ ᴅᴇ ᴠᴏᴛʀᴇ sᴇssɪᴏɴ...';

            try {
                const session = await ensureSession();

                display.innerText = 'ᴄᴏɴɴᴇxɪᴏɴ ᴀᴜ sᴇʀᴠᴇᴜʀ...';

                const response = await fetch(
                    '/api/sessions/' +
                    encodeURIComponent(session.sessionId) +
                    '/pairing',
                    {
                        method: 'POST',
                        headers: sessionHeaders(),
                        body: JSON.stringify({ phone }),
                        cache: 'no-store'
                    }
                );

                const data = await response.json();

                if (!response.ok || !data.code) {
                    display.innerText =
                        data.error ||
                        data.details ||
                        data.message ||
                        'ᴇʀʀᴇᴜʀ ᴅᴇ ᴘᴀɪʀɪɴɢ';

                    return;
                }

                display.innerText = data.code;

            } catch (error) {
                console.error('Pairing error:', error);

                display.innerText =
                    error.message || 'ᴇʀʀᴇᴜʀ ᴅᴇ ᴄᴏɴɴᴇxɪᴏɴ';

            } finally {
                pairingRequestActive = false;
                button.disabled = false;
                button.innerText = 'ᴏʙᴛᴇɴɪʀ ʟᴇ ᴄᴏᴅᴇ';
            }
        }

        // Chargement du QR de la session privée
        async function loadQR() {
            const qrImage = document.getElementById('qr-img');
            const qrStatus = document.getElementById('qr-status');

            try {
                const session = await ensureSession();

                const response = await fetch(
                    '/api/sessions/' +
                    encodeURIComponent(session.sessionId) +
                    '/qr',
                    {
                        method: 'GET',
                        headers: sessionHeaders(),
                        cache: 'no-store'
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error || 'Impossible de charger le QR'
                    );
                }

                if (data.qr) {
                    qrImage.src = data.qr;
                    qrImage.style.display = 'block';
                    qrStatus.style.display = 'none';

                } else {
                    qrImage.style.display = 'none';
                    qrStatus.style.display = 'block';
                    qrStatus.innerText =
                        data.status || 'ǫʀ ɴᴏɴ ᴅɪsᴘᴏɴɪʙʟᴇ';
                }

                if (data.status === 'connected') {
                    qrImage.style.display = 'none';
                    qrStatus.style.display = 'block';
                    qrStatus.innerText = 'ᴄᴏɴɴᴇxɪᴏɴ ʀᴇᴜssɪᴇ !';
                    stopQRPolling();
                }

            } catch (error) {
                console.error('QR error:', error);

                qrImage.style.display = 'none';
                qrStatus.style.display = 'block';
                qrStatus.innerText =
                    error.message || 'ᴇʀʀᴇᴜʀ ᴅᴜ sᴇʀᴠᴇᴜʀ';
            }
        }

        // Vérification périodique de l'état de la session
        async function refreshSessionStatus() {
            if (!privateSession) return;

            try {
                const data = await checkSessionStatus();

                if (data && data.status === 'connected') {
                    const qrStatus = document.getElementById('qr-status');

                    if (
                        document.getElementById('qr-section').classList.contains('active')
                    ) {
                        document.getElementById('qr-img').style.display = 'none';
                        qrStatus.style.display = 'block';
                        qrStatus.innerText = 'ᴄᴏɴɴᴇxɪᴏɴ ʀᴇᴜssɪᴇ !';
                    }

                    stopQRPolling();
                }

            } catch (error) {
                console.warn('Status check:', error.message);
            }
        }

        statusInterval = setInterval(refreshSessionStatus, 5000);
    </script>
</body>
</html>
